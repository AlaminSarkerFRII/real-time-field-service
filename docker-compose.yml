x-celery-common: &celery-common
  build:
    context: .
    dockerfile: deploy/Dockerfile
    target: dev
  volumes:
    - .:/app
  env_file:
    - .env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fieldsync
      POSTGRES_USER: fieldsync
      POSTGRES_PASSWORD: fieldsync
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldsync"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-realtime:
    <<: *celery-common
    command: celery -A config worker -l info -Q realtime -n realtime@%h

  worker-reports:
    <<: *celery-common
    command: celery -A config worker -l info -Q reports -n reports@%h

  beat:
    <<: *celery-common
    command: celery -A config beat -l info

volumes:
  pgdata:
